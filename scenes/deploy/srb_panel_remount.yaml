# LunarBot on Space Robotics Bench (SRB) — a ROS-attached external
# simulator, not one this project steps in-process (see
# openral_sim.backends.srb's module docstring and
# DeployScene.simulator/ExternalSimulatorSpec).
#
# `scene:` is registry-membership + provisioning only — LunarBot's HAL entry
# (_ROBOT_HAL_REGISTRY["lunar_bot"]) is bare_twin_sim=True, so it is NEVER
# scene-attached through this. `backend: isaacsim` is honest (SRB genuinely
# runs on Isaac Sim) and is what makes `openral deploy sim` resolve
# clock_origin=simulation / use_sim_time=true for this scene
# (_scene_backend_has_sim_clock keys off `backend`, not `id`) — the graph
# runs on SRB's own /clock, not the HAL's (LunarBotSRBHAL has no
# `sim_time_ns`, so the HAL correctly publishes no /clock of its own; SRB is
# the sole authority).
#
# `simulator:` is what actually spawns + gates SRB: `deploy_e2e.launch.py`
# adds it as an ExecuteProcess and blocks the HAL's own `configure` until
# `ready_topics` all have a publisher (tools/lifecycle_autostart.py
# --wait-for-topic), so the HAL never races SRB's boot.
#
# HOST-SPECIFIC (env_set.ISAAC_SIM_PATH, cwd): this native SRB + Isaac Sim
# install is not reproducible from a generic recipe (see
# docs/srb_integration_notes.md and the srb-native-install memory in the
# research repo) — this scene is authored for the dev host it was verified
# on, same as every other Isaac-backed deploy scene in this directory
# (isaac_franka.yaml needs OPENRAL_ISAAC_SIDECAR_PYTHON externally
# provisioned too).
#
# `env.camera_resolution=[640,480]` overrides SRB's default 64x64
# (VisualExtCfg) — confirmed live 2026-09-14 that this Hydra dotlist
# override actually takes (docs/research_findings.md F25 in the research
# repo): the relayed CameraInfo reports 640x480 and matches this project's
# hand-computed intrinsics for `robots/lunar_bot/robot.yaml`'s `sensors:`
# block exactly.
#
# The sensor bridge (openral_hal_lunar_bot.sensor_bridge_node) is declared
# under `simulator.bridges`: deploy_e2e.launch.py starts it with SRB and holds
# Nav2 until it publishes /odom (the F37 lifecycle wedge).
#
# Run: openral deploy sim --config scenes/deploy/srb_panel_remount.yaml \
#   --initial-task "drive forward one metre, then open the gripper"

robot_id: "lunar_bot"
seed: 0

scene:
  id: "srb"
  backend: "isaacsim"
  observation_height: 480
  observation_width: 640
  cameras: ["front", "wrist"]

simulator:
  argv:
    - "srb"
    - "agent"
    - "ros"
    - "--env"
    - "panel_remount_visual"
    - "env.robot=lunar_bot"
    - "env.camera_resolution=[640,480]"
    - "--headless"
  cwd: "/mnt/SharedData/Research/Space_Robot_Harness/space_robotics_bench"
  env_unset:
    - "CONDA_PREFIX"
    - "CONDA_EXE"
    - "CONDA_PYTHON_EXE"
    - "CONDA_DEFAULT_ENV"
    - "CONDA_SHLVL"
    - "CONDA_PROMPT_MODIFIER"
    - "PYTHONPATH"
  env_path_exclude_substrings:
    - "miniconda3"
  env_set:
    ISAAC_SIM_PATH: "$HOME/Programs/isaac-sim"
  ready_topics:
    - "/clock"
    - "/srb/env0/robot/joint_states"
    - "/srb/env0/imu_robot"
    - "/srb/env0/lidar_robot/pointcloud"
    - "/srb/env0/cam_front/image_rgb"
  # Cold Isaac Sim boot + first-render shader compile can run several
  # minutes on this host (srb-native-install memory) — generous, matching
  # isaac_franka.yaml's 1200s for the same reason.
  boot_timeout_s: 1200.0
  publishes_clock: true
  # Topic/TF adapter for SRB (sensor_bridge_node): /odom + odom->chassis_base_link TF,
  # /imu, /openral/cameras/*, /openral/lidar/points. Launched with the simulator;
  # Nav2 waits for `publishes` before its lifecycle bringup (F37 in the research repo).
  bridges:
    - package: "openral_hal_lunar_bot"
      executable: "sensor_bridge_node.py"
      name: "openral_hal_lunar_bot_sensor_bridge"
      pass_robot_yaml: true
      publishes:
        - "/odom"
        - "/openral/lidar/points"
