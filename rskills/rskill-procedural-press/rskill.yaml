# rSkill manifest -- press something described in words (kind: procedural).
# One physical operation for the reasoner; locate / approach / press / retreat are its internal stages
# (openral_rskill.procedural_press). This is the fold of Mission A's contact: approach_target + move_tool + grasp
# called in order by the model became this one call (research repo plan v4 §2, §3).

schema_version: "0.1"
name: "OpenRAL/rskill-procedural-lunar_bot-press"
version: "0.1.0"
license: "apache-2.0"
role: "s1"
kind: "procedural"

embodiment_tags:
  - "lunar_bot"

actuators_required:
  - kind: "cartesian_twist"
    control_mode_semantics:
      mode: "absolute"
      reference_frame: "chassis_base_link"

chunk_size: 1

latency_budget:
  per_chunk_ms: 200.0

description: >
  Press something described in words: find it in the wrist camera, stand off in front of it facing the surface,
  close in straight along the tool axis until the face takes the load, then withdraw. Fails with the stage reached
  (locate, approach, press, retreat) and its evidence.
actions:
  # `press` is not in openral_core's controlled action vocabulary; pressing a button is pushing a face, and `push`
  # is the vocabulary's word for it. The capability the model sees is still `press` (contracts.yaml).
  - "push"
objects: []
scenes:
  - "any"

procedural:
  entrypoint: "openral_rskill.procedural_press:PressRskill"
  default_goal_json: |
    {
      "target": "",
      "evidence_dir": "/tmp/openral_evidence",
      "vlm_model": "deepseek-flash",
      "vlm_endpoint": "https://api.deepseek.com",
      "view_part_depth_m": [0.42, 0.34, 0.52],
      "standoff_m": 0.10,
      "servo_gain_per_s": 0.5,
      "press_speed_m_s": 0.02,
      "press_ramp_s": 2.0,
      "press_stall_s": 4.0,
      "min_fit_agreement": 0.3,
      "correction_done_m": 0.006
    }

goal_params_schema:
  type: object
  properties:
    target: {type: string, description: "which feature is meant, in words: it only tells the vision model where to point; the button itself is found by its declared shape"}
    feature_xyz_map: {type: array, description: "the surveyed site point of the target, in map, from the boundary"}
    interface: {type: object, description: "the button the catalogue declares at that point (cap_radius_m, cap_centre_height_m, collar_radius_m, collar_top_height_m, travel_m), from the boundary"}
  required: ["target"]
