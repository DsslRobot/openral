[project]
name = "openral-dataset"
version = "0.3.1"  # x-release-please-version
description = "OpenRAL dataset bridge — RolloutRecorder + LeRobotDataset v3 / rosbag2 sinks for every skill execution"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # x-release-please-start-version
    "openral-core==0.3.1",                  # reason: RobotDescription / ObservationSpec / ActionSpec / SensorSpec schemas (normative bind targets)
    "openral-observability==0.3.1",         # reason: semconv constants (DATASET_REPO_ID / DATASET_EPISODE_IDX / DATASET_FRAME_IDX) + rskill_span helpers
    # x-release-please-end
    "numpy>=1.26",                   # reason: per-frame state / action / image arrays
    "structlog>=24.1",               # reason: structured logging per CLAUDE.md §5.1
    "mcap>=1.2",                     # reason: Rosbag2Sink mcap writer (PR3); also read by Rosbag2ToLeRobotConverter (PR4)
]

[project.optional-dependencies]
# PY310-HUMBLE PATCH: the `lerobot` extra (LeRobotDatasetSink) is removed in this
# fork. lerobot requires Python >= 3.12 in every published version, and `uv lock`
# resolves every extra of every workspace member — so leaving it declared makes
# the whole workspace unsolvable on the ROS 2 Humble interpreter, even though
# nothing here installs it. RolloutRecorder and Rosbag2Sink are unaffected and
# remain the recording path this project uses.
# PR3 ROS-side deps (mcap is PyPI; rosbag2_py + rclpy are system-installed
# via apt — same convention as elsewhere in the workspace, lazy-imported
# by Rosbag2Sink with a typed install hint if missing).
ros = [
    "mcap>=1.2",                     # reason: mcap storage backend — Foxglove-native, Humble+ default
    "mcap-ros2-support>=0.5",        # reason: ROS 2 msg serdes inside mcap
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openral_dataset"]
