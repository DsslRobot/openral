# RobotDescription -- LunarBot: 4-wheel independent-drive/independent-steering
# (4WIS/4WID) rover chassis + 7-DoF RealMan RM-75 manipulator + Inspire-Robots
# EG2-4C2 parallel gripper, fused into a single PhysX articulation.
#
# Source of truth for every joint name and every velocity/effort limit below:
# the Space Robotics Bench asset definition (a sibling project, developed
# independently -- this manifest is READ-derived from it, not authoritative
# over it):
#   space_robotics_bench/srb/assets/robot/mobile_manipulation/lunarbot.py
# Cross-checked against the live `sensor_msgs/JointState` SRB actually
# publishes on `/srb/env0/robot/joint_states` (21 joints, same names) --
# see the research repo's docs/srb_integration_notes.md.
#
# No URDF/SRDF exists for this robot (SRB ships a USD asset, not a URDF), so:
#   - `assets` is empty -- no self-collision lowering, no robot_state_publisher
#     wiring from this manifest today.
#   - every joint's `parent_link`/`child_link` below is an INFERRED label
#     from the joint-naming convention, not a real URDF/USD link name. They
#     are placeholders that satisfy the schema; nothing in this first
#     integration slice (BODY_TWIST only) resolves a kinematic chain through
#     them. Do not rely on them for collision/IK work without replacing them
#     from the real USD tree first.
#
# This is a real-hardware-shaped HAL slot (`hal.real`, not `hal.sim`):
# although SRB is a simulator, from OpenRAL's perspective it is an EXTERNAL
# system reached only over ROS 2 topics that OpenRAL does not own or step --
# structurally identical to how UR5eRealHAL reaches `ur_robot_driver` over
# ROS. `hal.sim` in this codebase specifically means OpenRAL's own in-process
# MuJoCo physics (MujocoArmHAL / SimAttachedHAL), which this is not.
#
# First integration slice: BODY_TWIST (mobile base) only, driven through the
# real candidate_action -> C++ safety kernel -> safe_action path -- see
# packages/openral_hal_lunar_bot/. CARTESIAN_TWIST (arm, via SRB's
# differential_inverse_kinematics action) and GRIPPER_BINARY (via SRB's
# binary_joint_position action) are follow-up work once the base path is
# proven end to end; declaring them here before the HAL implements them would
# let the reasoner select a control mode nothing actually serves.

name: "lunar_bot"
embodiment_kind: "mobile_manipulator"
base_frame: "chassis_base_link"

# No base_joints: LunarBot is NOT a holonomic x/y/yaw planar base (that field
# is for panda_mobile-style robots). It is a 4WIS/4WID rover driven by
# BODY_TWIST directly through SRB's FourWheelSteerActionCfg kinematics --
# there are no virtual planar-base joints to name.

joints:
  # -- Steering (4) -- effort_limit / velocity_limit from lunarbot.py's
  # "steering" ImplicitActuatorCfg (100.0 Nm / 1.9635 rad/s = 112.5 deg/s).
  - name: "chassis_to_front_left_steering_joint"
    joint_type: "revolute"
    parent_link: "chassis_base_link"
    child_link: "front_left_steering_link"
    velocity_limit: 1.9635
    effort_limit: 100.0
  - name: "chassis_to_front_right_steering_joint"
    joint_type: "revolute"
    parent_link: "chassis_base_link"
    child_link: "front_right_steering_link"
    velocity_limit: 1.9635
    effort_limit: 100.0
  - name: "chassis_to_rear_left_steering_joint"
    joint_type: "revolute"
    parent_link: "chassis_base_link"
    child_link: "rear_left_steering_link"
    velocity_limit: 1.9635
    effort_limit: 100.0
  - name: "chassis_to_rear_right_steering_joint"
    joint_type: "revolute"
    parent_link: "chassis_base_link"
    child_link: "rear_right_steering_link"
    velocity_limit: 1.9635
    effort_limit: 100.0
  # -- Wheels (4) -- "wheels" ImplicitActuatorCfg: 48.512 Nm / 41.4458 rad/s.
  # Wheel radius 0.1453 m (lunarbot.py FourWheelSteerActionCfg) -> ~6.0 m/s
  # theoretical max wheel-surface speed; the SafetyEnvelope below declares a
  # much more conservative operational bound for this first integration test.
  - name: "front_left_steering_to_wheel_joint"
    joint_type: "continuous"
    parent_link: "front_left_steering_link"
    child_link: "front_left_wheel_link"
    velocity_limit: 41.4458
    effort_limit: 48.512
  - name: "front_right_steering_to_wheel_joint"
    joint_type: "continuous"
    parent_link: "front_right_steering_link"
    child_link: "front_right_wheel_link"
    velocity_limit: 41.4458
    effort_limit: 48.512
  - name: "rear_left_steering_to_wheel_joint"
    joint_type: "continuous"
    parent_link: "rear_left_steering_link"
    child_link: "rear_left_wheel_link"
    velocity_limit: 41.4458
    effort_limit: 48.512
  - name: "rear_right_steering_to_wheel_joint"
    joint_type: "continuous"
    parent_link: "rear_right_steering_link"
    child_link: "rear_right_wheel_link"
    velocity_limit: 41.4458
    effort_limit: 48.512
  # -- Arm (7-DoF RealMan RM-75) -- lunarbot.py's "arm" ImplicitActuatorCfg,
  # per-joint effort/velocity limits. Not yet driven (CARTESIAN_TWIST is a
  # follow-up); declared so the safety kernel has real limits ready for it.
  - name: "joint1"
    joint_type: "revolute"
    parent_link: "chassis_base_link"
    child_link: "Link1"
    velocity_limit: 3.14
    effort_limit: 60.0
  - name: "joint2"
    joint_type: "revolute"
    parent_link: "Link1"
    child_link: "Link2"
    velocity_limit: 3.14
    effort_limit: 60.0
  - name: "joint3"
    joint_type: "revolute"
    parent_link: "Link2"
    child_link: "Link3"
    velocity_limit: 3.92
    effort_limit: 30.0
  - name: "joint4"
    joint_type: "revolute"
    parent_link: "Link3"
    child_link: "Link4"
    velocity_limit: 3.92
    effort_limit: 30.0
  - name: "joint5"
    joint_type: "revolute"
    parent_link: "Link4"
    child_link: "Link5"
    velocity_limit: 3.92
    effort_limit: 10.0
  - name: "joint6"
    joint_type: "revolute"
    parent_link: "Link5"
    child_link: "Link6"
    velocity_limit: 3.92
    effort_limit: 10.0
  - name: "joint7"
    joint_type: "revolute"
    parent_link: "Link6"
    child_link: "Link7"
    velocity_limit: 3.92
    effort_limit: 10.0
  # -- Gripper (Inspire EG2-4C2, 6 actuated joints, mimic-linked in SRB at the
  # action-group level) -- lunarbot.py's "gripper" ImplicitActuatorCfg.
  # position_limits: (0.0, 1.0) is the OpenRAL HAL contract for a normalised
  # jaw fraction (JointSpec docstring) -- SRB's own mechanical stroke
  # (+/- 0.82 rad, per-joint sign in _GRIPPER_SIGN) is a simulator-internal
  # detail the HAL translation layer owns, not this envelope. Not yet driven
  # (GRIPPER_BINARY is a follow-up).
  - name: "eg2_joint1"
    joint_type: "revolute"
    parent_link: "Link7"
    child_link: "eg2_joint1_link"
    position_limits: [0.0, 1.0]
    velocity_limit: 0.6308
    effort_limit: 0.9
  - name: "eg2_joint2"
    joint_type: "revolute"
    parent_link: "Link7"
    child_link: "eg2_joint2_link"
    position_limits: [0.0, 1.0]
    velocity_limit: 0.6308
    effort_limit: 0.9
  - name: "eg2_joint3"
    joint_type: "revolute"
    parent_link: "Link7"
    child_link: "eg2_joint3_link"
    position_limits: [0.0, 1.0]
    velocity_limit: 0.6308
    effort_limit: 0.9
  - name: "eg2_joint4"
    joint_type: "revolute"
    parent_link: "Link7"
    child_link: "eg2_joint4_link"
    position_limits: [0.0, 1.0]
    velocity_limit: 0.6308
    effort_limit: 0.9
  - name: "eg2_joint5"
    joint_type: "revolute"
    parent_link: "Link7"
    child_link: "eg2_joint5_link"
    position_limits: [0.0, 1.0]
    velocity_limit: 0.6308
    effort_limit: 0.9
  - name: "eg2_joint6"
    joint_type: "revolute"
    parent_link: "Link7"
    child_link: "eg2_joint6_link"
    position_limits: [0.0, 1.0]
    velocity_limit: 0.6308
    effort_limit: 0.9

capabilities:
  locomotion:
    - "wheeled"
  can_lift_kg: 0.0  # RM-75 payload not sourced from lunarbot.py; unset rather than guessed
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: false
  has_vision: true  # front_camera + wrist_camera per lunarbot.py Frame declarations
  has_lidar: false
  has_vision_slam: false
  # First integration slice: base only. Add "cartesian_twist" /
  # "gripper_binary" once the HAL's arm-IK / gripper translation exists (see
  # the module docstring above).
  supported_control_modes:
    - "body_twist"
  embodiment_tags:
    - "lunar_bot"
    # Canonical class tag for any robot with a planar base + body_twist
    # actuator (openral_core.schemas) -- lets generic base-only rSkills
    # target the class without naming this specific robot.
    - "mobile_base"

safety:
  deadman_required: true
  # Conservative, provisional bounds for this FIRST safety-kernel integration
  # test -- NOT derived from a validated LunarBot operating envelope (none
  # exists yet). Theoretical ceiling from wheel velocity_limit x wheel_radius
  # (41.4458 rad/s x 0.1453 m ~= 6.0 m/s) is far higher; deliberately declaring
  # a small fraction of it here until real operational limits are set by
  # experiment design, per execution_plan.md's "do not hard-code scientific
  # thresholds" rule -- this is an engineering safety margin for bring-up, not
  # a claimed operational limit.
  max_base_linear_speed_m_s: 0.3
  max_base_angular_speed_rad_s: 0.5

sdk_kind: "open"
hal:
  sim: null
  real: "openral_hal.lunar_bot_srb:LunarBotSRBHAL"
schema_version: "0.1"
